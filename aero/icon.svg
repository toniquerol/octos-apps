<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc"><title id="title">OcToS Aero</title><desc id="desc">Silueta blanca BMW Serie 3 E46 Touring y líneas de flujo naranjas; visualización no CFD</desc>

