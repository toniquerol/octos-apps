<path d="M19 70Q19 66 26 61L75 30Q82 26 89 30L138 61Q144 66 140 72L89 106Q83 111 77 107L23 80Q17 76 19 70Z" fill="none" stroke="#2A2B2F" stroke-width="8" stroke-linejoin="round"/>
