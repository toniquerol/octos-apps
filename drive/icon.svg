<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc"><title id="title">OcToS Drive</title><desc id="desc">Bloque de terreno tridimensional con una pequeña flecha central y trayectoria naranja</desc>

