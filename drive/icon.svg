<path d="M19 78 78 108Q83 111 88 107L140 75" fill="none" stroke="#2A2B2F" stroke-width="7" stroke-linejoin="round"/>
<!-- Curvas de nivel simplificadas sobre la superficie -->
<path d="M43 62C55 54 61 53 70 57S87 59 93 53M32 77C43 69 52 69 62 75M76 41C84 40 91 48 102 48M114 69C123 65 129 66 135 70" fill="none" stroke="#2A2B2F" stroke-width="5" stroke-linecap="round"/>
