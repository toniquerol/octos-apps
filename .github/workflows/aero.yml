name: Aero quality and standalone packaging
on:
  push:
    branches:
      - main
      - aero/**
    paths:
      - 'aero/**'
      - '.github/workflows/aero.yml'
  workflow_dispatch:
# Only test and package the newest push on each branch.
concurrency:
  group: aero-standalone-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  aero:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone Aero
        run: node aero/scripts/build.cjs
      - name: UI and GLB smoke tests
        run: node aero/tests/check.cjs
      - name: GPU buffer and memory tests
        run: node aero/tests/flow.test.cjs
      - name: Geometry, segment and precision tests
        run: node aero/tests/geometry.test.cjs
      - name: Structured CFD interpolation and integration tests
        run: node aero/tests/cfd.test.cjs
      - name: Verify clean standalone bundle
        run: |
          test -s aero/index.html
          grep -q 'const AeroGeometry' aero/index.html
          grep -q 'const AeroPaths' aero/index.html
          grep -q 'const AeroCFD' aero/index.html
      - name: Install temporary browser test dependencies
        run: |
          cd aero
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Chromium WebGL2 and interactive smoke test
        timeout-minutes: 12
        run: node aero/tests/browser.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aero-webgl2-screenshots
          path: |
            aero/tests/aero-four-views.png
            aero/tests/aero-detail.png
            aero/tests/aero-section.png
          if-no-files-found: ignore
      - name: Commit generated standalone bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          git add -- aero/index.html
          if git diff --cached --quiet; then
            echo "Standalone bundle is already current."
            exit 0
          fi

          # Never publish a bundle built from an outdated commit.
          git fetch --no-tags origin "$branch"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::Newer commits exist on $branch. Skipping stale bundle."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(aero): update verified standalone HTML'
          if git push origin "HEAD:refs/heads/$branch"; then
            exit 0
          fi

          # A simultaneous push is expected during rapid editing; its next run
          # will build the newest code. A real permission/network error must fail.
          git fetch --no-tags origin "$branch"
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::Another push arrived while publishing; the latest run will rebuild."
            exit 0
          fi
          echo "::error::Standalone bundle push failed without a newer remote commit."
          exit 1
