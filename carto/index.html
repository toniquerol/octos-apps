/* Estilos críticos Leaflet integrados: evitan teselas en el flujo de página */
.leaflet-container{overflow:hidden;outline:0;position:relative;background:#dae2e9;-webkit-tap-highlight-color:transparent}
.leaflet-container.leaflet-touch-drag{-ms-touch-action:pinch-zoom;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-zoom{-ms-touch-action:pan-x pan-y;touch-action:pan-x pan-y}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-tile{width:256px;height:256px;border:0;margin:0;padding:0;visibility:hidden}
.leaflet-container .leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}

.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-left .leaflet-control{float:left;margin-left:10px}.leaflet-right .leaflet-control{float:right;margin-right:10px}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}

html,body{height:100%;width:100%;margin:0;overflow:hidden}

.service{padding:0 4px;border-bottom:1px solid #233346}.service:last-child{border-bottom:0}
.service>summary{display:flex;align-items:center;gap:8px;padding:11px 3px;cursor:pointer;list-style:none}

.service[open]>summary:before{content:'▾'}

.service .subtree{padding:0 0 10px 19px;max-height:360px;overflow:auto}.service .load-state{color:#aec6d1;font-size:11px;padding:5px 2px 9px}
.service .load-state.error{color:#ffc58c}.service .subitem{padding:8px 4px;border-bottom:1px solid #26394a;display:flex;gap:9px;align-items:flex-start}
.service .subitem:last-child{border-bottom:none}.service .subitem label{display:flex;align-items:flex-start;gap:8px;cursor:pointer;min-width:0;flex:1}
.service .subitem label span{font-size:11px;line-height:1.3;overflow-wrap:anywhere}
.service .subitem input[type=checkbox]{accent-color:var(--accent);margin-top:1px;flex:none}

/* ATLAS OcToS · V8 — Tema antracita y naranja */

.layer-color-controls{display:flex;align-items:center;gap:7px;margin:7px 0 2px;min-width:0}

.layer-color-input{width:37px;height:28px;min-width:37px;padding:2px;background:#2d2d30;border:1px solid #66666b;border-radius:6px;cursor:pointer;touch-action:manipulation}
.active-row .layer-color-input{width:37px;height:28px;min-width:37px;margin:0;flex:none}
.layer-color-input::-webkit-color-swatch-wrapper{padding:0}
.layer-color-input::-webkit-color-swatch{border:0;border-radius:3px}
.layer-color-reset{background:#343437;color:#e6e6e8;border:1px solid #55555b;border-radius:6px;font-size:10px;padding:5px 8px;cursor:pointer}
.layer-color-reset:hover:not(:disabled){border-color:#ff891f}
.layer-color-reset:disabled{opacity:.4;cursor:default}
.subitem .layer-color-controls{margin-left:23px;flex-basis:100%;width:calc(100% - 23px)}
.subitem{flex-wrap:wrap}
.active-detail .layer-color-controls{margin-top:7px}

/* V14: panel lateral compacto y secciones plegables */
.sidehead{padding:15px 14px 11px}
.sidehead h1{font-size:18px;line-height:1.25;margin:0 0 10px;font-weight:650}
.sidehead .search{font-size:12px;line-height:1.3;padding:7px 10px;min-height:34px;border-radius:7px}
.sidehead>div:last-child{margin-top:8px!important}
.group>summary{cursor:pointer;padding:10px 12px;user-select:none}
.group>summary:after{display:inline-block;content:'⌄';font-size:17px;line-height:1;color:#ff891f;transition:transform .15s;transform:rotate(-90deg)}
.group[open]>summary:after{transform:rotate(0deg)}
.group>summary:hover{background:#404043}
.group>summary:focus-visible{outline:2px solid #ff891f;outline-offset:-3px}
.group:not([open]){margin-bottom:6px}

/* Panel lateral plegable: deja el mapa a pantalla completa sin desplazamientos */
.shell{position:relative;transition:grid-template-columns .22s ease}
.shell.sidebar-hidden{grid-template-columns:0 minmax(0,1fr)}
.shell #sidebar{overflow:hidden;min-width:0;transition:opacity .17s ease}
.shell.sidebar-hidden #sidebar{visibility:hidden;opacity:0;pointer-events:none}
.sidebar-collapse{position:absolute;z-index:1005;top:50%;left:340px;transform:translate(-1px,-50%);width:25px;height:76px;padding:0;border:1px solid #5c5c60;border-left:0;border-radius:0 9px 9px 0;background:#29292b;color:#ff891f;font-size:25px;line-height:1;cursor:pointer;transition:left .22s ease,background .15s ease}
.sidebar-collapse:hover{background:#3d3530}
.shell.sidebar-hidden .sidebar-collapse{left:0}
@media(max-width:760px){
 .shell,.shell.sidebar-hidden{display:block}
 .shell #sidebar{position:absolute;top:0;bottom:0;left:0;width:min(340px,92vw);z-index:850;visibility:visible;opacity:1;transform:translateX(0);transition:transform .22s ease,opacity .17s ease}
 .shell.sidebar-hidden #sidebar{visibility:hidden;opacity:0;transform:translateX(-105%)}
 .sidebar-collapse{left:min(340px,92vw);top:50%;height:70px}
 .shell.sidebar-hidden .sidebar-collapse{left:0}
}

/* Cabecera: marca centrada de forma independiente de los controles */
header{position:relative}
header .brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;text-align:center;z-index:1;pointer-events:none;white-space:nowrap}
header .brand b{display:block;font-size:18px;line-height:1.3}
header .brand small{display:block;font-size:10px;letter-spacing:.15em}
header .head-actions{margin-left:auto;position:relative;z-index:2}
@media(max-width:760px){header .brand b{font-size:13px}header .brand small{font-size:8px;letter-spacing:.08em}header .brand{left:43%}}

/* V18: botones táctiles de orden sin arrastre */
.active-row{position:relative;align-items:flex-start;cursor:default}
.active-order-buttons{display:flex;flex-direction:column;flex:none;gap:5px;margin-top:-5px}
.active-order-buttons .layer-move{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:42px;height:42px;min-width:42px;padding:0;background:#353538;border:1px solid #77777b;border-radius:8px;color:#ffad69;font-size:25px;font-weight:700;line-height:1;cursor:pointer;touch-action:manipulation}
.active-order-buttons .layer-move:hover:not(:disabled),.active-order-buttons .layer-move:focus-visible{border-color:#ff891f;background:#493527;outline:2px solid #ff891f;outline-offset:1px}
.active-order-buttons .layer-move:disabled{opacity:.3;cursor:default}
.active-order-help{padding:5px 5px 9px;color:#aaa9ae;font-size:10px;line-height:1.3}
@media(pointer:coarse){.active-order-buttons .layer-move{width:48px;height:48px;min-width:48px;font-size:28px}}
@media(max-width:760px){.active-panel{width:min(365px,calc(100vw - 30px))}.active-order-buttons .layer-move{width:46px;height:46px;min-width:46px}}

/* V19: las capas apagadas permanecen en la lista para comparaciones */
#activeList .active-row.temporarily-hidden{opacity:.73;background:#242427}
#activeList .active-row.temporarily-hidden .active-name{color:#bdbdc2}
#activeList .visibility-label{font-size:10px;color:#ffad69;font-weight:500}
#activeList .active-row>input[type=checkbox]{min-width:20px;min-height:20px;cursor:pointer}

/* Controles cartográficos: separación del borde y botones táctiles coherentes con Drive */
.leaflet-bottom.leaflet-right{right:30px;bottom:35px}
.leaflet-control-zoom{border:1px solid #575757!important;border-radius:10px!important;box-shadow:0 4px 15px #0006!important}
.leaflet-control-zoom a,.leaflet-touch .leaflet-control-zoom a{width:51px!important;height:51px!important;line-height:50px!important;background:#27272b!important;color:#ff891f!important;font-size:30px!important;border-color:#545457!important}
@media(max-width:760px){.leaflet-bottom.leaflet-right{right:25px;bottom:30px}.topbar{right:25px}}

       // LiDAR, que dispone de interruptor exclusivo en la cabecera.
       const ly=layers.get(key);
       if(check.checked){if(ly){ly.addTo(map);ly.setOpacity(opacity.get(key)??.8);active.add(key);applyStoredLayerColor(key)}}
       else{if(ly)map.removeLayer(ly);active.delete(key)}
       refresh();
     }
   });
   const detail=el('div','active-detail');
   detail.appendChild(el('span','active-name',info?.title||key));if(!active.has(key))detail.appendChild(el('small','visibility-label','Oculta temporalmente'));
   if(info?.group && info.group!==info.title)detail.appendChild(el('small','',info.group));
   const controls=el('div','active-opacity');
   const percent=el('span','active-opacity-value',Math.round((opacity.get(key)??.8)*100)+'%');
   const range=el('input');
   range.type='range';range.min='0';range.max='100';range.step='1';range.dataset.opacityKey=key;
   range.value=String(Math.round((opacity.get(key)??.8)*100));
   range.setAttribute('aria-label','Opacidad de '+(info?.title||key));
   range.title='Opacidad de '+(info?.title||key);
   range.addEventListener('input',()=>{
     const amount=Number(range.value);
     opacity.set(key,amount/100);
     layers.get(key)?.setOpacity(amount/100);
     percent.textContent=amount+'%';
     syncOpacityControls(key,amount,range);
   });
   controls.append(range,percent);
   detail.appendChild(controls);
   if(layerTypes.get(key)==='wms')addColorControl(detail,key);
   row.append(check,createOrderButtons(key,orderIndex++,rememberedLayers.length),detail);target.appendChild(row);
 }
}

const layerColors=new Map();
const layerTypes=new Map();
const colorFilters=new Map();
let nextColorFilterId=0;
const SVG_NS='http://www.w3.org/2000/svg';
function isColorable(it,child){return it.type==='wms'&&!!child;}
function setLayerColor(key,color){
 if(!/^#[0-9a-fA-F]{6}$/.test(color))return;
 layerColors.set(key,color);
 let filter=colorFilters.get(key);
 if(!filter){
   const id='octos-color-'+(++nextColorFilterId);
   const element=document.createElementNS(SVG_NS,'filter');
   element.setAttribute('id',id);
   element.setAttribute('x','0');element.setAttribute('y','0');
   element.setAttribute('width','100%');element.setAttribute('height','100%');
   element.setAttribute('color-interpolation-filters','sRGB');
   const matrix=document.createElementNS(SVG_NS,'feColorMatrix');
   matrix.setAttribute('type','matrix');
   element.appendChild(matrix);
   document.getElementById('colorFilterDefs').appendChild(element);
   filter={id,element,matrix};colorFilters.set(key,filter);
 }
 const nums=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)/255);
 const values=nums.flatMap(v=>[0,0,0,0,v]).concat([0,0,0,1,0]);
 filter.matrix.setAttribute('values',values.join(' '));
 const container=layers.get(key)?.getContainer?.();
 if(container)container.style.filter='url(#'+filter.id+')';
 syncLayerColorControls(key);
}
function resetLayerColor(key){
 layerColors.delete(key);
 const container=layers.get(key)?.getContainer?.();
 if(container)container.style.filter='';
 syncLayerColorControls(key);
}
function applyStoredLayerColor(key){
 const color=layerColors.get(key);
 if(!color)return;
 const filter=colorFilters.get(key);
 const container=layers.get(key)?.getContainer?.();
 if(filter&&container)container.style.filter='url(#'+filter.id+')';
}
function syncLayerColorControls(key){
 for(const el of document.querySelectorAll('[data-color-key]')){
   if(el.dataset.colorKey!==key)continue;
   if(el.matches('input[type=color]')){
     el.value=layerColors.get(key)||'#ff891f';
     el.title='Color de visualización'+(layerColors.has(key)?': '+layerColors.get(key):' (original)');
   }
   if(el.matches('button'))el.disabled=!layerColors.has(key);
 }
}
function addColorControl(parent,key){
 const wrap=el('div','layer-color-controls');
 const caption=el('span','layer-color-caption','Color');
 const color=el('input','layer-color-input');
 color.type='color';color.value=layerColors.get(key)||'#ff891f';color.dataset.colorKey=key;
 color.setAttribute('aria-label','Cambiar color de '+key);
 color.title='Recolorear visualmente esta capa WMS';
 color.addEventListener('input',e=>{e.stopPropagation();setLayerColor(key,color.value)});
 color.addEventListener('click',e=>e.stopPropagation());
 const reset=el('button','layer-color-reset','Original');
 reset.type='button';reset.dataset.colorKey=key;reset.disabled=!layerColors.has(key);
 reset.title='Restaurar los colores originales de la capa';
 reset.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();resetLayerColor(key)});
 wrap.append(caption,color,reset);
 parent.appendChild(wrap);
}
function layerKey(it,child){return child?it.id+'::'+child.id:it.id}
function applyLayer(it,child,checked){const key=layerKey(it,child);if(!checked){active.delete(key);const ly=layers.get(key);if(ly)map.removeLayer(ly);refresh();return}
 try{let ly=layers.get(key);if(!ly){ly=child?remoteLayer(it,child):tileOf(it);watch(ly,child?.title||it.name);layers.set(key,ly)}ly.addTo(map);ly.setOpacity(opacity.get(key)??.8);active.add(key);if(!rememberedLayers.includes(key))rememberedLayers.push(key);layerTypes.set(key,it.type);applyStoredLayerColor(key);activeNames.set(key,{title:child?.title||it.name,group:it.name});msg('Activada: '+(child?.title||it.name));}catch(e){msg('Error al activar la capa: '+e.message,true)}refresh()}
function catalogLayer(it){const row=el('div','layer catalog-only');row.dataset.search=(it.name+' '+it.desc).toLowerCase();const detail=el('div','detail');const title=el('strong','',it.name);detail.appendChild(title);detail.appendChild(el('small','',it.desc));const a=el('a','catalog-link','Consultar producto en el catálogo ↗');a.href=it.url;a.target='_blank';a.rel='noopener noreferrer';detail.appendChild(a);row.appendChild(detail);return row}
function directLayer(it){const label=el('label','layer');label.dataset.search=(it.name+' '+it.desc).toLowerCase();const input=el('input');input.type=it.type==='base'?'radio':'checkbox';if(it.type==='base'){input.name='baselayer';input.dataset.base=it.id;input.checked=it.id==='base';input.addEventListener('change',()=>setBase(it))}else{input.dataset.activeId=it.id;input.addEventListener('change',()=>applyLayer(it,null,input.checked))}label.appendChild(input);const detail=el('div','detail');detail.appendChild(el('strong','',it.name));detail.appendChild(el('small','',it.desc));if(it.type!=='base')addOpacity(detail,it,null);label.appendChild(detail);return label}
function addOpacity(parent,it,child){const key=layerKey(it,child),range=el('input','opacity');range.type='range';range.min=0;range.max=100;range.value=80;range.dataset.opacityKey=key;range.title='Transparencia: '+(child?.title||it.name);range.setAttribute('aria-label',range.title);range.addEventListener('input',()=>{opacity.set(key,Number(range.value)/100);layers.get(key)?.setOpacity(opacity.get(key));syncOpacityControls(key,Number(range.value),range)});range.addEventListener('click',e=>e.stopPropagation());parent.appendChild(range)}
function childLayer(it,child){const item=el('div','subitem');const label=el('label');const checkbox=el('input');checkbox.type='checkbox';checkbox.dataset.activeId=layerKey(it,child);checkbox.addEventListener('change',()=>applyLayer(it,child,checkbox.checked));const title=el('span','',child.title||child.id);title.title=child.id;label.append(checkbox,title);item.appendChild(label);const range=el('input');range.type='range';range.min=0;range.max=100;range.value=80;range.dataset.opacityKey=layerKey(it,child);range.title='Opacidad';range.setAttribute('aria-label','Opacidad de '+child.title);range.addEventListener('input',()=>{const key=layerKey(it,child);opacity.set(key,+range.value/100);layers.get(key)?.setOpacity(+range.value/100);syncOpacityControls(key,Number(range.value),range)});item.appendChild(range);if(isColorable(it,child))addColorControl(item,layerKey(it,child));return item}
function serviceLayer(it){const d=el('details','service');d.dataset.search=(it.name+' '+it.desc).toLowerCase();const summary=el('summary');const heading=el('span','service-heading');heading.appendChild(el('strong','',it.name));heading.title=it.desc+' · '+it.type.toUpperCase();heading.appendChild(el('small','',it.type.toUpperCase()));summary.appendChild(heading);const count=el('span','service-count');summary.appendChild(count);d.appendChild(summary);const subtree=el('div','subtree');const status=el('div','load-state','Despliega para consultar las subcapas disponibles.');subtree.appendChild(status);d.appendChild(subtree);serviceNodes.set(it.id,{node:d,subtree,status,count});d.addEventListener('toggle',()=>{if(d.open)loadService(it)});return d}
function directChildren(node,tag){return Array.from(node?.children||[]).filter(c=>c.localName===tag)}
function first(node,tag){return directChildren(node,tag)[0]}
function value(node,tag){return first(node,tag)?.textContent?.trim()||''}
function descendants(node,tag){return Array.from(node?.getElementsByTagName('*')||[]).filter(c=>c.localName===tag)}
function wmsCapabilities(xml){const list=[],seen=new Set();const cap=descendants(xml,'Capability')[0];const root=first(cap,'Layer');if(!root)return [];
 function walk(node,parents=[]){const name=value(node,'Name'),title=value(node,'Title')||name;const availableCRS=[...parents,...directChildren(node,'CRS').map(c=>c.textContent.trim()),...directChildren(node,'SRS').map(c=>c.textContent.trim())];if(name&&!seen.has(name)){seen.add(name);if(availableCRS.some(x=>/3857|900913|CRS:84|EPSG:4326/i.test(x)) || availableCRS.length===0)list.push({id:name,title,crs:availableCRS})}directChildren(node,'Layer').forEach(child=>walk(child,availableCRS))}walk(root);return list}
function wmtsCapabilities(xml){const contents=descendants(xml,'Contents')[0];if(!contents)return [];
 const matrices=new Map();for(const set of directChildren(contents,'TileMatrixSet')){const id=value(set,'Identifier'),crs=value(set,'SupportedCRS');const levels=directChildren(set,'TileMatrix').map(m=>({id:value(m,'Identifier'),scale:Number(value(m,'ScaleDenominator'))}));matrices.set(id,{id,crs,levels})}
 const entries=[];for(const node of directChildren(contents,'Layer')){const id=value(node,'Identifier'),title=value(node,'Title')||id;if(!id)continue;const setNames=directChildren(node,'TileMatrixSetLink').map(n=>value(n,'TileMatrixSet'));const matrix=setNames.map(n=>matrices.get(n)).find(m=>m&&/(3857|900913|GoogleMapsCompatible)/i.test(m.crs+' '+m.id));if(!matrix)continue;
 const styleNode=directChildren(node,'Style').find(n=>n.getAttribute('isDefault')==='true')||first(node,'Style');const style=value(styleNode,'Identifier')||'default';const format=directChildren(node,'Format').map(n=>n.textContent.trim()).find(f=>/image\/(png|jpeg|jpg|webp)/i.test(f))||value(node,'Format')||'image/png';const resource=directChildren(node,'ResourceURL').find(n=>n.getAttribute('resourceType')==='tile'&&n.getAttribute('format')===format)?.getAttribute('template')||'';
 entries.push({id,title,matrix,style,format,resource})}return entries}
async function loadService(it){const ui=serviceNodes.get(it.id);if(!ui||ui.loaded||ui.loading)return;ui.loading=true;ui.status.textContent='Consultando servicio oficial…';ui.status.classList.remove('error');
 try{let entries=servicesCache.get(it.id);if(!entries){const url=it.endpoint+(it.endpoint.includes('?')?'&':'?')+'SERVICE='+it.type.toUpperCase()+'&VERSION='+(it.type==='wms'?'1.3.0':'1.0.0')+'&REQUEST=GetCapabilities';const response=await fetch(url,{mode:'cors'});if(!response.ok)throw new Error('HTTP '+response.status);const xml=new DOMParser().parseFromString(await response.text(),'text/xml');if(xml.querySelector('parsererror'))throw new Error('el servidor no ha entregado un XML válido');entries=it.type==='wms'?wmsCapabilities(xml):wmtsCapabilities(xml);servicesCache.set(it.id,entries)}
 if(!entries.length)throw new Error('no se han encontrado subcapas compatibles');ui.subtree.replaceChildren();const n=el('div','load-state',entries.length+' subcapas disponibles. Activa las que quieras.');ui.subtree.appendChild(n);for(const child of entries)ui.subtree.appendChild(childLayer(it,child));ui.loaded=true;refresh();}
 catch(err){ui.status.textContent='No se pudo consultar: '+err.message+'. El servidor puede bloquear CORS o no estar disponible.';ui.status.classList.add('error');ui.subtree.replaceChildren(ui.status);const a=el('a','','Abrir servicio oficial');a.href=it.endpoint+'?SERVICE='+it.type.toUpperCase()+'&REQUEST=GetCapabilities';a.target='_blank';a.rel='noopener noreferrer';ui.subtree.appendChild(a);msg('No se ha podido consultar «'+it.name+'». Revisa el servicio oficial.',true)}finally{ui.loading=false}}
function remoteLayer(it,c){if(it.type==='wms'){return L.tileLayer.wms(it.endpoint,{layers:c.id,format:'image/png',transparent:true,version:'1.3.0',maxZoom:19,attribution:it.id.startsWith('flood')?'© MITECO / SNCZI':'© IGN / CNIG'})}
 const levels=c.matrix.levels,standard=559082264.029;const tileUrl=(coords)=>{const expected=standard/Math.pow(2,coords.z);let best=null,delta=Infinity;for(const m of levels){const d=Math.abs(Math.log2(m.scale/expected));if(d<delta){delta=d;best=m}}if(!best||delta>.09)return '';if(!Number.isFinite(best.scale))return ''; // tesela solo si la escala coincide con EPSG:3857
 const q=new URLSearchParams({SERVICE:'WMTS',REQUEST:'GetTile',VERSION:'1.0.0',LAYER:c.id,STYLE:c.style,FORMAT:c.format,TILEMATRIXSET:c.matrix.id,TILEMATRIX:best.id,TILEROW:String(coords.y),TILECOL:String(coords.x)});return it.endpoint+(it.endpoint.includes('?')?'&':'?')+q.toString()};
 const WMTS=L.TileLayer.extend({getTileUrl:tileUrl});return new WMTS('',{maxZoom:19,minZoom:0,attribution:'© IGN / CNIG'})}
function build(){groups.slice(1).filter(g=>g.items.some(it=>it.id!=='lidar')).forEach((g,i)=>{const d=el('details','group');d.open=i===0;const summary=el('summary','',g.name);const counter=el('span','count',g.items.filter(it=>it.id!=='lidar').length+' elementos');summary.appendChild(counter);summary.title='Abrir o cerrar '+g.name;d.appendChild(summary);const body=el('div','groupbody');for(const it of g.items.filter(it=>it.id!=='lidar'))body.appendChild(it.type==='catalog'?catalogLayer(it):(it.type==='wms'||it.type==='wmts'?serviceLayer(it):directLayer(it)));d.appendChild(body);catalog.appendChild(d)})}
function buildBasePicker(){
 const holder=document.getElementById('baseOptions');
 for(const it of baseChoices){
   const row=el('label','base-option');
   const input=el('input');input.type='radio';input.name='topBase';input.value=it.id;input.checked=it.id===basemap;
   input.addEventListener('change',()=>{setBase(it);document.getElementById('basePicker').open=false});
   const detail=el('span','base-option-text');detail.append(el('strong','',it.name),el('small','',it.desc));
   row.append(input,detail);holder.appendChild(row);
 }

 document.addEventListener('pointerdown',ev=>{if(!picker.contains(ev.target))picker.open=false});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape')picker.open=false});
}
buildBasePicker();build();setBase(baseChoices[0]);
document.getElementById('lidarQuick').addEventListener('click',()=>{
 const enabled=!active.has('lidar');
 applyLayer(lidarChoice,null,enabled);
 if(enabled)msg('LiDAR activado · IGN. Ajusta la transparencia en el control de la barra superior.');

const lidarOpacity=document.getElementById('lidarOpacity');
lidarOpacity.addEventListener('input',()=>{
 const value=Number(lidarOpacity.value);
 opacity.set('lidar',value/100);
 layers.get('lidar')?.setOpacity(value/100);

const hash=new URLSearchParams(location.hash.slice(1));if(hash.has('lat')&&hash.has('lng')){const lat=+hash.get('lat'),lng=+hash.get('lng'),zoom=+hash.get('z')||10;if(Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=85&&Math.abs(lng)<=180)map.setView([lat,lng],Math.max(3,Math.min(19,zoom)))}
document.getElementById('filter').addEventListener('input',e=>{const term=e.target.value.trim().toLowerCase();for(const g of catalog.querySelectorAll('.group')){let visible=0;for(const d of g.querySelectorAll('.layer,.service')){let show=d.dataset.search.includes(term)||Boolean(term&&[...d.querySelectorAll('.subitem span')].some(n=>n.textContent.toLowerCase().includes(term)));d.classList.toggle('hidden',!show);if(show){visible++;if(term&&d.classList.contains('service'))d.open=true}}g.classList.toggle('hidden',!visible);if(term&&visible)g.open=true}});
document.getElementById('clear').addEventListener('click',()=>{for(const key of [...active]){const layer=layers.get(key);if(layer)map.removeLayer(layer);active.delete(key);activeNames.delete(key)}rememberedLayers.length=0;refresh();msg('Se ha limpiado la lista de superposiciones.')});

// GPS: solicita permisos únicamente al pulsar el botón; conserva la vista al fallar.
let gpsDot=null,gpsAccuracy=null;
const gpsButton=document.getElementById('gps');
gpsButton.addEventListener('click',()=>{
  if(!('geolocation' in navigator)){
    msg('Este navegador no ofrece geolocalización.',true);return;
  }
  if(!window.isSecureContext){
    msg('La geolocalización requiere una página segura (HTTPS o un contexto local autorizado por el navegador).',true);return;
  }
  gpsButton.disabled=true;
  gpsButton.textContent='…';
  msg('Solicitando acceso a la ubicación del dispositivo…');
  navigator.geolocation.getCurrentPosition(pos=>{
    gpsButton.disabled=false;
    gpsButton.textContent='◎';
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const accuracy=pos.coords.accuracy;
    const ll=[lat,lng];
    if(gpsDot) map.removeLayer(gpsDot);
    if(gpsAccuracy)map.removeLayer(gpsAccuracy);
    gpsAccuracy=L.circle(ll,{radius:accuracy,color:'#ff891f',weight:1,fillColor:'#ff891f',fillOpacity:0.12,interactive:false}).addTo(map);
    gpsDot=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="gps-marker"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
    gpsDot.bindPopup('<strong>Tu ubicación aproximada</strong><br>Precisión estimada: '+Math.round(accuracy)+' m');
    map.setView(ll,Math.max(map.getZoom(),15),{animate:true});
    msg('Ubicación obtenida. Precisión estimada: '+Math.round(accuracy)+' metros.');
  },err=>{
    gpsButton.disabled=false;
    gpsButton.textContent='◎';
    const why=err.code===1?'Permiso de ubicación denegado.':err.code===2?'Ubicación no disponible en este dispositivo.':'Tiempo agotado al obtener la ubicación.';
    msg(why+' Comprueba los permisos del navegador y los servicios de ubicación.',true);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
});
